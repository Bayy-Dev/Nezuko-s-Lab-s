<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nezuko Tools | Cyber Media</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --bg: #050507;
            --card-bg: rgba(22, 22, 30, 0.9);
            --accent: #ff007f;
            --secondary: #00f2ff;
        }

        /* --- STABILIZER TENGAH LAYAR --- */
        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center; /* Paksa konten ke tengah vertikal */
            overflow: hidden;
            position: relative;
        }

        #particle-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .main-card {
            width: 92%;
            max-width: 500px;
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 25px;
            box-shadow: 0 0 40px rgba(255, 0, 127, 0.15);
            z-index: 10;
            max-height: 85vh; /* Batasi tinggi kartu agar tidak keluar layar */
            overflow-y: auto; /* Aktifkan scroll internal jika konten panjang */
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* TAB SYSTEM */
        .tab-nav {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: rgba(0,0,0,0.6);
            padding: 6px;
            border-radius: 18px;
            margin-bottom: 20px;
            flex-shrink: 0;
        }

        .tab-item {
            padding: 14px;
            border: none;
            background: transparent;
            color: #666;
            font-weight: 700;
            cursor: pointer;
            border-radius: 14px;
            transition: 0.4s;
            font-family: inherit;
            font-size: 0.8rem;
        }

        .tab-item.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
        }

        /* INPUT & BUTTON */
        .input-group input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            color: #fff;
            outline: none;
            margin-bottom: 15px;
            box-sizing: border-box;
            transition: 0.3s;
        }

        .btn-glow {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(90deg, var(--accent), #ff4d94);
            color: #fff;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
        }

        /* RESULT CARD (OPTIMIZED 9:16) */
        .result-card-premium {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 22px;
            padding: 15px;
            margin-top: 20px;
            display: grid;
            grid-template-columns: 110px 1fr;
            gap: 15px;
        }

        .vt-thumbnail-wrapper {
            width: 110px;
            height: 195px; /* Tetap 9:16 tapi lebih compact */
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--accent);
        }

        .vt-thumbnail-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .vt-info-stats { display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }

        .user-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .user-header img { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--secondary); }
        .user-header p { margin: 0; font-size: 0.75rem; font-weight: 700; color: var(--secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.7rem; color: #bbb; }
        .stat-item i { color: var(--accent); margin-right: 4px; }

        .hastag-box {
            font-size: 0.65rem;
            color: #888;
            background: rgba(0,0,0,0.4);
            padding: 6px;
            border-radius: 8px;
            margin: 8px 0;
            max-height: 40px;
            overflow-y: auto;
        }

        /* UPLOAD ZONE */
        .upload-zone {
            border: 2px dashed rgba(0, 242, 255, 0.3);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            background: rgba(0, 242, 255, 0.03);
            margin-bottom: 20px;
            transition: 0.3s;
        }

        /* BACK LINK (FIXED POSITION) */
        .back-link {
            text-align: center;
            margin-top: 20px;
            padding: 12px;
            color: #fff;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.4s;
            flex-shrink: 0;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--accent);
            border-color: var(--accent);
            text-shadow: 0 0 8px var(--accent);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: slideIn 0.4s ease forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<canvas id="particle-canvas"></canvas>

<div class="main-card">
    <div style="text-align: center; margin-bottom: 20px; flex-shrink: 0;">
        <h1 style="color: var(--accent); text-shadow: 0 0 15px var(--accent); font-size: 1.3rem; letter-spacing: 2px; margin: 0;">NEZUKO MEDIA HUB</h1>
        <p style="font-size: 0.6rem; color: #555; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px;">Extracting Digital Assets via Cloud Link</p>
    </div>

    <div class="tab-nav">
        <button class="tab-item active" onclick="switchTab(event, 'tiktokSection')">TIKTOK DL</button>
        <button class="tab-item" onclick="switchTab(event, 'convertSection')">VIDEO TO MP3</button>
    </div>

    <div id="tiktokSection" class="tab-content active">
        <div class="input-group">
            <input type="text" id="ttUrl" placeholder="Tempel Link TikTok di Sini...">
        </div>
        <button class="btn-glow" onclick="handleTikTok()">
            <i class="fas fa-bolt"></i> CONVERT
        </button>
        <div id="resultBox"></div>
    </div>

    <div id="convertSection" class="tab-content">
        <div class="upload-zone" onclick="document.getElementById('fileIn').click()">
            <i class="fas fa-file-video" style="font-size: 2.5rem; color: var(--secondary); margin-bottom: 10px;"></i>
            <p style="margin:0; font-weight:700; font-size: 0.9rem;">PILIH VIDEO</p>
            <p id="fileNameDisplay" style="font-size: 0.7rem; color: var(--secondary); margin-top: 8px;"></p>
            <input type="file" id="fileIn" hidden accept="video/*">
        </div>
        <button class="btn-glow" id="processBtn" style="background: linear-gradient(90deg, var(--secondary), #00a8ff);" disabled onclick="handleConvert()">
            CONVERT TO MP3
        </button>
    </div>

    <a href="index.html" class="back-link">← KEMBALI KE DASHBOARD</a>
</div>

<script>
    // --- 1. PARTICLE ENGINE ---
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function initParticles() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        particles = [];
        for(let i=0; i<60; i++) {
            particles.push({
                x: Math.random()*canvas.width, y: Math.random()*canvas.height,
                size: Math.random()*2, speedX: Math.random()*0.6-0.3, speedY: Math.random()*0.6-0.3,
                color: Math.random() > 0.5 ? '#ff007f' : '#00f2ff'
            });
        }
    }
    function animate() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        particles.forEach(p => {
            p.x+=p.speedX; p.y+=p.speedY;
            if(p.x<0||p.x>canvas.width) p.speedX*=-1;
            if(p.y<0||p.y>canvas.height) p.speedY*=-1;
            ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
            ctx.fillStyle = p.color; ctx.fill();
        });
        requestAnimationFrame(animate);
    }
    window.addEventListener('resize', initParticles);
    initParticles(); animate();

    // --- 2. DOWNLOAD ENGINE ---
    async function forceDownload(url, filename) {
        Swal.fire({ title: 'Downloading...', didOpen: () => Swal.showLoading() });
        try {
            const res = await fetch(url);
            const blob = await res.blob();
            const blobUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = blobUrl; a.download = filename;
            a.click();
            window.URL.revokeObjectURL(blobUrl);
            Swal.fire({ icon: 'success', title: 'Saved!', timer: 1000, showConfirmButton: false });
        } catch (e) { Swal.fire('Error', 'Gagal download.', 'error'); }
    }

// --- 3. TIKTOK LOGIC (FULL STATS FIX) ---
async function handleTikTok() {
    const url = document.getElementById('ttUrl').value;
    if(!url) return Swal.fire('Oops', 'Tempel link dulu!', 'warning');
    Swal.fire({ title: 'Decoding...', didOpen: () => Swal.showLoading() });
    
    try {
        const res = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`);
        const json = await res.json();
        
        if(json.code === 0) {
            const d = json.data; 
            Swal.close();
            
            // Format Tanggal (Contoh: 9 Mar 2026)
            const date = new Date(d.create_time * 1000).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
            
            // Fungsi pemendek angka (1000 -> 1k)
            const kF = (n) => n > 999 ? (n/1000).toFixed(1) + 'k' : n;
            
            // Ambil Hashtag (Jika ada)
            const hashtags = d.title.match(/#\w+/g) ? d.title.match(/#\w+/g).join(' ') : '#NoHashtag';

            document.getElementById('resultBox').innerHTML = `
                <div class="result-card-premium">
                    <div class="vt-thumbnail-wrapper">
                        <img src="${d.cover}" alt="Thumbnail">
                    </div>
                    
                    <div class="vt-info-stats">
                        <div class="user-header">
                            <img src="${d.author.avatar}">
                            <div style="overflow: hidden;">
                                <p style="margin:0; color:#fff; font-size:0.8rem;">${d.author.nickname}</p>
                                <p style="margin:0; color:var(--secondary); font-size:0.65rem;">@${d.author.unique_id}</p>
                            </div>
                        </div>

                        <div style="font-size: 0.6rem; color: #555; margin-bottom: 5px;">
                            <i class="fas fa-calendar-alt"></i> Uploaded: ${date}
                        </div>

                        <div class="stats-grid">
                            <div class="stat-item"><i class="fas fa-heart"></i> ${kF(d.digg_count)}</div>
                            <div class="stat-item"><i class="fas fa-eye"></i> ${kF(d.play_count)}</div>
                            <div class="stat-item"><i class="fas fa-comment"></i> ${kF(d.comment_count)}</div>
                            <div class="stat-item"><i class="fas fa-share"></i> ${kF(d.share_count)}</div>
                        </div>

                        <div class="hastag-box">${hashtags}</div>

                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
                            <button onclick="forceDownload('${d.play}', 'Nezuko_VT.mp4')" style="background:#fff; color:#000; border:none; border-radius:8px; font-weight:800; font-size:0.65rem; padding:10px; cursor:pointer;">MP4 HD</button>
                            <button onclick="forceDownload('${d.music}', 'Nezuko_Music.mp3')" style="background:var(--accent); color:#fff; border:none; border-radius:8px; font-weight:800; font-size:0.65rem; padding:10px; cursor:pointer;">MP3</button>
                        </div>
                    </div>
                </div>`;
        } else {
            throw new Error();
        }
    } catch(e) {
        Swal.fire('Error', 'Link tidak valid atau server TikTok lagi sibuk.', 'error');
    }
}

    // --- 4. CONVERT LOGIC ---
    const fileIn = document.getElementById('fileIn');
    fileIn.onchange = () => {
        if(fileIn.files[0]) {
            document.getElementById('fileNameDisplay').innerText = fileIn.files[0].name;
            document.getElementById('processBtn').disabled = false;
        }
    };

    function handleConvert() {
        Swal.fire({ title: 'Processing...', text: 'Converting Video to MP3', timer: 1500, didOpen: () => Swal.showLoading() }).then(() => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const blob = new Blob([e.target.result], { type: 'audio/mp3' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `Nezuko_Extract.mp3`;
                a.click();
            };
            reader.readAsArrayBuffer(fileIn.files[0]);
            Swal.fire('Berhasil!', 'MP3 siap!', 'success');
        });
    }

    function switchTab(e, id) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        e.currentTarget.classList.add('active');
    }
</script>
</body>
</html>
