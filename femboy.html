<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cek Femboy AI | NEZUKO'S LAB'S</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
<style>
        :root {
            --primary: #8a2be2;
            --bg: #050505;
            --card-bg: rgba(10, 10, 10, 0.75);
            --text: #ffffff;
            --text-dim: #a0a0a0;
            --accent: #ff007f;
        }

        /* --- RESET & GLOBAL --- */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* --- ANIMASI MASUK SMOOTH --- */
        @keyframes fadeInPage {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Nav dan Container mulai dari transparan lalu dianimasikan */
        nav {
            animation: fadeInPage 0.8s ease-out forwards;
            opacity: 0;
        }

        .container {
            animation: fadeInPage 1s ease-out 0.3s forwards; /* Delay 0.3s supaya nav muncul duluan */
            opacity: 0;
        }

        /* --- PARTICLE CANVAS --- */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* --- NAVBAR --- */
        nav {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--primary);
            margin-left: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 10px #00ff88;
        }

        /* --- CONTAINER --- */
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            z-index: 5;
        }

        /* --- MAIN CARD --- */
        .main-card {
            background: var(--card-bg);
            padding: 40px 25px;
            border-radius: 32px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            backdrop-filter: blur(25px);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .main-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary), var(--accent), transparent);
        }

        h1 { 
            font-family: 'Orbitron', sans-serif; 
            font-size: 1.5rem; font-weight: 800; 
            margin-bottom: 8px;
            text-shadow: 0 0 15px rgba(138, 43, 226, 0.5);
        }
        
        .subtitle { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 30px; }

        /* --- INPUT --- */
        .input-group { margin-bottom: 25px; text-align: left; }
        label { display: block; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px; margin-left: 5px; letter-spacing: 1px;}
        
        input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 16px 20px;
            border-radius: 16px;
            color: white;
            font-family: inherit;
            font-size: 1rem;
            transition: 0.3s;
        }
        input:focus { border-color: var(--primary); background: rgba(255,255,255,0.1); box-shadow: 0 0 15px rgba(138, 43, 226, 0.2); }

        /* --- BUTTONS --- */
        .btn-check {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(138, 43, 226, 0.3);
            text-transform: uppercase;
            margin-bottom: 15px;
        }
        .btn-check:active { transform: scale(0.96); }

        .btn-back {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-dim);
            text-decoration: none;
            padding: 14px;
            border-radius: 16px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }

        /* --- RESULT AREA --- */
        #resultArea { display: none; margin-top: 35px; animation: fadeInUp 0.6s cubic-bezier(0.23, 1, 0.32, 1); }
        
        .anime-frame {
            width: 140px; height: 140px;
            border-radius: 50%;
            border: 4px solid var(--accent);
            margin: 0 auto 20px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.4);
        }
        .anime-frame img { width: 100%; height: 100%; object-fit: cover; }

        .percentage { 
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem; font-weight: 800; 
            color: var(--accent); margin: 5px 0 10px; 
            text-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
        }
        .desc { font-size: 0.9rem; color: var(--text-dim); line-height: 1.6; padding: 0 10px; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <nav>
        <div class="logo">NEZUKO'S <span>LAB'S</span></div>
        <div style="font-size: 0.75rem; color: var(--text-dim); display: flex; align-items: center;">
            <span class="status-dot"></span> System Online
        </div>
    </nav>

    <div class="container">
        <div class="main-card">
            <div style="font-size: 2.5rem; margin-bottom: 15px; filter: drop-shadow(0 0 10px rgba(255,0,127,0.5));">💕</div>
            <h1>FEMBOY ANALYZER</h1>
            <p class="subtitle">Mendeteksi kadar keimutan dalam namamu</p>

            <div class="input-group">
                <label><i class="fas fa-fingerprint"></i> MASUKAN NAMA</label>
                <input type="text" id="userName" placeholder="Ketik nama kamu..." autocomplete="off">
            </div>

            <button class="btn-check" onclick="startProcess()">IDENTIFIKASI <i class="fas fa-dna"></i></button>
            
            <a href="index.html" class="btn-back"><i class="fas fa-th-large"></i> KEMBALI KE DASHBOARD</a>

            <div id="resultArea">
                <div class="anime-frame">
                    <img src="" id="animeImg" alt="Result Character">
                </div>
                <div class="verdict" style="font-weight: 700; font-size: 0.9rem; letter-spacing: 1px;">HASIL ANALISA:</div>
                <div class="percentage" id="percentNum">0%</div>
                <div class="desc" id="resultDesc">...</div>
            </div>
        </div>
    </div>

<script>
        // --- PARTICLE SYSTEM ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function initParticles() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            const particleCount = Math.floor((canvas.width * canvas.height) / 15000);
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    size: Math.random() * 2
                });
            }
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(138, 43, 226, 0.5)';
            ctx.strokeStyle = 'rgba(138, 43, 226, 0.1)';

            particles.forEach((p, i) => {
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                for (let j = i + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 100) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(drawParticles);
        }

        window.addEventListener('resize', initParticles);
        initParticles();
        drawParticles();

        // --- CORE LOGIC (MODIFIED WITH NAME & SPACING) ---
        function startProcess() {
            const name = document.getElementById('userName').value.trim();
            if (!name) {
                Swal.fire({
                    icon: 'error',
                    title: 'Waduh...',
                    text: 'Isi namanya dulu dong manis!',
                    background: '#151515',
                    color: '#fff',
                    confirmButtonColor: '#8a2be2'
                });
                return;
            }

            document.getElementById('resultArea').style.display = 'none';

            Swal.fire({
                title: 'MENGANALISA...',
                html: 'Memindai aura di sekitar nama <b>' + name + '</b>...',
                allowOutsideClick: false,
                background: '#151515',
                color: '#fff',
                didOpen: () => { Swal.showLoading(); }
            });

            setTimeout(() => {
                const randomPercent = Math.floor(Math.random() * 101);
                let description = "";
                let imageUrl = "";

                // Kondisi berdasarkan persentase dengan penyebutan nama
                if (randomPercent >= 90) {
                    description = "Gawat! " + name + ", kamu imut tingkat dewa. Fix besok langsung beli maid outfit.";
                    imageUrl = "https://files.catbox.moe/03faap.jpg";
                } else if (randomPercent >= 70) {
                    description = "Bakat terpendam, " + name + ". Thigh highs udah di keranjang belanja belum?";
                    imageUrl = "https://files.catbox.moe/np7v8e.jpg";
                } else if (randomPercent >= 40) {
                    description = "Hey " + name + ", ada bibit-bibit unggul. Tipis-tipis aja, jangan dipaksain panggil Senpai.";
                    imageUrl = "https://files.catbox.moe/skug17.jpg";
                } else if (randomPercent >= 15) {
                    description = "Lurus banget kayak jalan tol, " + name + ". Nggak ada imut-imutnya sama sekali.";
                    imageUrl = "https://files.catbox.moe/rny0vb.jpg";
                } else {
                    description = "Nol besar! " + name + ", kamu terlalu macho. Liat rok aja mungkin langsung alergi.";
                    imageUrl = "https://files.catbox.moe/1g2jiz.jpg";
                }

                document.getElementById('percentNum').innerText = randomPercent + "%";
                document.getElementById('resultDesc').innerText = description;
                document.getElementById('animeImg').src = imageUrl;

                Swal.close();
                document.getElementById('resultArea').style.display = 'block';

                setTimeout(() => {
                    document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 100);

            }, 2000);
        }
    </script>
</body>
</html>
