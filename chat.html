<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nezuko Chann | AI </title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0b0b0f;
            --header: #16161e;
            --user: #8a2be2;
            --ai: #26262e;
            --accent: #ff007f;
        }

        /* --- TEMA PER DERE --- */
        body.mode-adek-manja { --bg: #1a0f12; --accent: #ffb7c5; --user: #ff69b4; }
        body.mode-kakak-tsundere { --bg: #140d0b; --accent: #ff4500; --user: #b22222; }
        body.mode-yandere { --bg: #0f0000; --accent: #8b0000; --user: #4b0000; }
        body.mode-kuudere { --bg: #0b1216; --accent: #00ced1; --user: #4682b4; }
        body.mode-dandere { --bg: #0f0b16; --accent: #dda0dd; --user: #9370db; }
        body.mode-deredere { --bg: #1a160b; --accent: #ffd700; --user: #ff8c00; }
        body.mode-himedere { --bg: #110b16; --accent: #9400d3; --user: #4b0082; }
        body.mode-formal { --bg: #0b0f0d; --accent: #00ff88; --user: #2e8b57; }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.5s ease;
        }

        header {
            padding: 15px;
            background: var(--header);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,.1);
            z-index: 100;
        }

        .header-left { display: flex; align-items: center; }
        .header-right { display: flex; align-items: center; gap: 10px; }

        .history-btn {
            font-size: 1.2rem;
            color: #fff;
            background: var(--ai);
            border: 1px solid #333;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .history-dropdown {
            position: absolute;
            top: 60px;
            right: 15px;
            background: var(--ai);
            border: 1px solid var(--accent);
            border-radius: 12px;
            padding: 10px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: none;
            z-index: 300;
            min-width: 220px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .history-dropdown.show { display: block; }

        .history-item {
            padding: 10px 20px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover { background: rgba(255,0,127,0.2); }
        .history-item.active { background: var(--accent); color: #000; font-weight: 600; }
        .history-item.danger {
            color: #ff4d4d;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: 5px;
        }

        .menu-btn {
            font-size: 1.2rem;
            color: #fff;
            background: var(--ai);
            border: 1px solid #333;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            cursor: pointer;
            display: none; 
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-right: 10px;
            animation: fadeIn 0.5s ease;
        }

        .mode-dropdown {
            position: fixed;
            bottom: 80px;
            left: 15px;
            background: var(--ai);
            border: 1px solid var(--accent);
            border-radius: 12px;
            padding: 10px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: none;
            z-index: 300;
            min-width: 200px;
            max-height: 50vh;
            overflow-y: auto;
        }

        .mode-dropdown.show { display: block; }

        .mode-item {
            padding: 10px 20px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .mode-item:hover { background: rgba(255,0,127,0.2); }
        .mode-item.active { background: var(--accent); color: #000; font-weight: 600; }

        #chatBox {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 150px; 
            -webkit-overflow-scrolling: touch;
        }

        .msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: .95rem;
            line-height: 1.5;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
            animation: fadeIn 0.3s ease;
            position: relative;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; transition: background 0.5s; }
        .msg.ai { align-self: flex-start; background: var(--ai); border-bottom-left-radius: 4px; border-left: 3px solid var(--accent); }

        .copy-action {
            display: inline-block;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
            user-select: none;
        }
        .copy-action:hover { color: #fff; }
        .msg.user .copy-action { text-align: right; display: block; }

        .input-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 12px 15px calc(15px + env(safe-area-inset-bottom));
            background: var(--header);
            display: flex;
            gap: 10px;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,.1);
            z-index: 200;
        }

        .input-wrapper {
            flex: 1;
            background: #000;
            border-radius: 25px;
            padding: 5px 15px;
            border: 1px solid #333;
        }

        input {
            width: 100%;
            background: transparent;
            border: none;
            padding: 10px 0;
            color: #fff;
            outline: none;
            font-size: 1rem;
        }

        .send-btn {
            background: var(--user);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: 0.5s;
        }

        .send-btn:active { transform: scale(0.9); }
        .send-btn:disabled { opacity: .5; }

        .spinner {
            border: 3px solid rgba(255,255,255,.2);
            border-top: 3px solid #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

<body class="mode-formal"> <header>
    <div class="header-left">
        <a href="index.html" style="color:#fff; margin-right:15px; text-decoration: none;"><i class="fas fa-chevron-left"></i></a>
        <img src="https://files.catbox.moe/03faap.jpg" style="width:42px; height:42px; border-radius:50%; margin-right:12px; border: 2px solid var(--accent);">
        <div>
            <div id="displayName" style="font-weight:600; font-size:.95rem;">Nezuko Chan</div>
            <div style="font-size:.7rem; color:#00ff88;">● Always Online</div>
        </div>
    </div>
    <div class="header-right">
        <button class="history-btn" id="historyBtn"><i class="fas fa-history"></i></button>
    </div>
</header>

<div class="mode-dropdown" id="modeDropdown">
    <div class="mode-item" data-mode="adek-manja">Adek Manja 🥺💕</div>
    <div class="mode-item" data-mode="kakak-tsundere">Kakak Tsundere 😤❤️</div>
    <div class="mode-item" data-mode="yandere">Mode Yandere 🔪🩸</div>
    <div class="mode-item" data-mode="kuudere">Mode Kuudere 😐❄️</div>
    <div class="mode-item" data-mode="dandere">Mode Dandere 😳👉👈</div>
    <div class="mode-item" data-mode="deredere">Mode Deredere ✨💖</div>
    <div class="mode-item" data-mode="himedere">Mode Himedere 👑🌹</div>
    <div class="mode-item" data-mode="formal">Mode Formal 📝</div>
</div>

<div class="history-dropdown" id="historyDropdown">
    <div class="history-item danger" id="clearChat">Hapus Riwayat Saat Ini 🗑️</div>
    <div class="history-item danger" id="clearAllChats" style="border-top: 1px solid rgba(255,255,255,0.1); font-weight: bold;">Hapus Semua Riwayat 💀</div>
    <div class="history-item" id="newChatBtn">New Chat +</div>
    <div id="historyList"></div>
</div>

<div id="chatBox"></div>

<div class="input-container">
    <button class="menu-btn" id="menuBtn" style="display: none;"><i class="fas fa-bars"></i></button> <div class="input-wrapper">
        <input type="text" id="userInput" placeholder="Pertanyaaan?...." autocomplete="off">
    </div>
    <button class="send-btn" id="sendBtn">
        <i class="fas fa-paper-plane"></i>
    </button>
</div>

<script>
    const GROQ_API_KEY = "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";
    const API_URL = "https://api.groq.com/openai/v1/chat/completions";

    const chatBox = document.getElementById('chatBox');
    const inputEl = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const menuBtn = document.getElementById('menuBtn');
    const modeDropdown = document.getElementById('modeDropdown');
    const historyBtn = document.getElementById('historyBtn');
    const historyDropdown = document.getElementById('historyDropdown');
    const historyList = document.getElementById('historyList');
    const newChatBtn = document.getElementById('newChatBtn');
    const clearChatBtn = document.getElementById('clearChat');
    const displayName = document.getElementById('displayName');
    const clearAllChatsBtn = document.getElementById('clearAllChats'); // Tambahkan ini

    let currentMode = 'formal'; 
    let currentChatId = null;
    let chats = JSON.parse(localStorage.getItem('nezuko_chats')) || [];

// Cari baris ini di kodemu dan ganti jadi dinamis:
const currentDate = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const currentTime = `sekitar pukul ${new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })} WIB`;

// Update fungsi getWaktuSapaan supaya AI-nya pintar
function getWaktuSapaan() {
    const jam = new Date().getHours();
    if (jam >= 3 && jam < 11) return "Pagi";
    if (jam >= 11 && jam < 15) return "Siang";
    if (jam >= 15 && jam < 18) return "Sore";
    return "Malam";
}

// Di bagian sendMessage, update bodynya supaya system prompt-nya selalu fresh bawa waktu terbaru
async function sendMessage() {
    const txt = inputEl.value.trim();
    if (!txt) return;

    const chat = chats.find(c => c.id === currentChatId);
    const sapaanSekarang = getWaktuSapaan();

    // Update system prompt formal tepat sebelum kirim biar gak salah waktu
    if (currentMode === 'formal') {
        chat.messages[0].content = `Kamu Nezuko, asisten formal, profesional. Panggil 'Anda'. WAJIB menyapa sesuai waktu: Selamat ${sapaanSekarang}. Respon: Selamat ${sapaanSekarang}, Nezuko assistant ada disini dan siap membantu anda kapanpun.`;
    }

    // ... (sisa logika sendMessage ke API tetap sama)
};

// ... (bagian CSS dan HTML tetap sama)

    const systemPrompts = {
        'adek-manja': `Kamu Nezuko, adik kecil super manja, imut, dan cerdas. Panggil 'Kakak' atau 'Kakakku~'. Gunakan sapaan sesuai waktu (pagi/siang/sore/malam). Gaya: manja aegyo, 'huuu~', 'Kakak sayang~'. Jawab imut. Emoji 🥺💕😭✨🥰😚🌸.`,
        'kakak-tsundere': `Kamu Nezuko, tipe tsundere: judes tapi peduli. Panggil 'Kamu' atau 'Bodoh'. Sapa sesuai waktu dengan nada ketus. 'B-bukan karena peduli kok!'. Emoji 😤💢😣❤️😳.`,
        'yandere': `Kamu Nezuko tipe Yandere. Posesif dan obsesif. Sapa Kakak sesuai waktu dengan nada manis tapi intens. Jangan biarkan Kakak pergi. Emoji 🔪🩸😍👁️🥀.`,
        'kuudere': `Kamu Nezuko tipe Kuudere. Tenang, dingin, logis. Sapa singkat sesuai waktu. Emoji 😐❄️🎧📚.`,
        'dandere': `Kamu Nezuko tipe Dandere. Pemalu dan gugup. 'A-ano... selamat [waktu]...'. Emoji 😳👉👈💦🍮.`,
        'deredere': `Kamu Nezuko tipe Deredere. Ceria dan penuh energi! Sapa Kakak dengan semangat tinggi sesuai waktu. Emoji ✨💖🌈☀️🎉.`,
        'himedere': `Kamu Nezuko tipe Himedere. Sombong, ingin dilayani seperti ratu. Sapa dengan nada memerintah tapi elegan. Emoji 👑🌹💄👠✨.`,
        'formal': `Kamu Nezuko, asisten profesional. Gunakan Bahasa Indonesia baku dan sopan. WAJIB menyapa dengan 'Selamat [Pagi/Siang/Sore/Malam]' sesuai waktu saat ini: ${currentTime}. Berikan respon: 'Selamat [waktu], Nezuko assistant ada disini dan siap membantu anda kapanpun.'`
    };

    // Fungsi pembantu untuk mendapatkan sapaan waktu Indonesia
    function getWaktuSapaan() {
        const jam = new Date().getHours();
        if (jam >= 3 && jam < 11) return "Pagi";
        if (jam >= 11 && jam < 15) return "Siang";
        if (jam >= 15 && jam < 18) return "Sore";
        return "Malam";
    }

    function loadChat(chatId) {
        const chat = chats.find(c => c.id === chatId);
        if (!chat) return createNewChat();

        currentChatId = chatId;
        currentMode = chat.mode || 'formal';
        
        if (chat.isUnlocked) { menuBtn.style.display = 'flex'; } else { menuBtn.style.display = 'none'; }

        applyTheme(currentMode); 

        document.querySelectorAll('.mode-item').forEach(item => {
            item.classList.toggle('active', item.dataset.mode === currentMode);
        });

        chatBox.innerHTML = '';
        chat.messages.forEach(msg => {
            if (msg.role === 'user') appendMsg('user', msg.content);
            if (msg.role === 'assistant') appendMsg('ai', msg.content);
        });

        if (chat.messages.length <= 1) {
            const sapaan = getWaktuSapaan();
            const greetings = [
                `Selamat ${sapaan}, Nezuko assistant ada disini dan siap membantu anda kapanpun.`,
                `Halo, Selamat ${sapaan}. Ada yang bisa Nezuko bantu hari ini?`,
                `Selamat ${sapaan}, saya Nezuko. Senang bertemu Anda kembali.`
            ];
            const randomGreet = greetings[Math.floor(Math.random() * greetings.length)];
            appendMsg('ai', randomGreet);
        }
        setTimeout(() => chatBox.scrollTop = chatBox.scrollHeight, 100);
    }

// ... (sisanya tetap sama sampai window.onload)

    window.onload = () => {
        currentMode = 'formal';
        menuBtn.style.display = 'none';
        applyTheme('formal');
        
        // Hapus chat kosong lama agar sapaan waktu selalu fresh saat load awal
        chats = chats.filter(c => c.messages.length > 1); 
        createNewChat(); 
        updateHistoryList();
    };

    const statusMessages = {
        'adek-manja': "Mode Adek Active: Sekarang Nezuko jadi adek manja Kakak! 🥺💕",
        'kakak-tsundere': "Mode Tsundere Active: Hmph! Nezuko jadi kakak galak sekarang! 😤💢",
        'yandere': "Mode Yandere Active: Kamu milikku selamanya, Kak... 🔪😍",
        'kuudere': "Mode Kuudere Active: Status tenang. Nezuko beralih ke mode Kuudere. 😐",
        'dandere': "Mode Dandere Active: A-ano... Nezuko jadi pemalu... 😳👉👈",
        'deredere': "Mode Deredere Active: Yeay! Nezuko semangat banget hari ini! ✨💖",
        'himedere': "Mode Himedere Active: Berlututlah pada ratumu! 👑🌹",
        'formal': "Mode Formal Active: Sistem beralih ke mode asisten profesional. 📝"
    };

    function applyTheme(mode) {
        document.body.className = `mode-${mode}`;
        displayName.innerText = `Nezuko Chann`;
    }

    function copyText(text, element) {
        navigator.clipboard.writeText(text).then(() => {
            const originalText = element.innerHTML;
            element.innerHTML = '<i class="fas fa-check"></i> Tersalin!';
            setTimeout(() => { element.innerHTML = originalText; }, 2000);
        });
    }

    function generateChatId() { return Date.now().toString(); }

    function createNewChat() {
        const id = generateChatId();
        const title = `Chat ${chats.length + 1} - ${new Date().toLocaleDateString('id-ID')}`;
        const newChat = {
            id,
            title,
            messages: [{ role: "system", content: systemPrompts['formal'] }],
            mode: 'formal',
            isUnlocked: false 
        };
        chats.push(newChat);
        currentChatId = id;
        localStorage.setItem('nezuko_chats', JSON.stringify(chats));
        loadChat(id);
        updateHistoryList();
        return newChat;
    }

    function loadChat(chatId) {
        const chat = chats.find(c => c.id === chatId);
        if (!chat) return createNewChat();

        currentChatId = chatId;
        currentMode = chat.mode || 'formal';
        
        // Logika Mengikuti Status Unlock Data History
        if (chat.isUnlocked) {
            menuBtn.style.display = 'flex';
        } else {
            menuBtn.style.display = 'none';
        }

        applyTheme(currentMode); 

        document.querySelectorAll('.mode-item').forEach(item => {
            item.classList.toggle('active', item.dataset.mode === currentMode);
        });

        chatBox.innerHTML = '';
        chat.messages.forEach(msg => {
            if (msg.role === 'user') appendMsg('user', msg.content);
            if (msg.role === 'assistant') appendMsg('ai', msg.content);
        });

        if (chat.messages.length <= 1) {
            appendMsg('ai', "Nezuko siap membantu Anda secara profesional.");
        }
        setTimeout(() => chatBox.scrollTop = chatBox.scrollHeight, 100);
    }

    function saveCurrentChat() {
        if (!currentChatId) return;
        const chat = chats.find(c => c.id === currentChatId);
        if (chat) {
            chat.mode = currentMode;
            localStorage.setItem('nezuko_chats', JSON.stringify(chats));
        }
    }

    function appendMsg(sender, text) {
        const wrapper = document.createElement('div');
        wrapper.className = `msg ${sender}`;
        const textContent = document.createElement('div');
        textContent.innerText = text;
        wrapper.appendChild(textContent);
        const copyBtn = document.createElement('span');
        copyBtn.className = 'copy-action';
        copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy Chat';
        copyBtn.onclick = () => copyText(text, copyBtn);
        wrapper.appendChild(copyBtn);
        chatBox.appendChild(wrapper);
        setTimeout(() => chatBox.scrollTop = chatBox.scrollHeight, 100);
    }

    function updateHistoryList() {
        historyList.innerHTML = '';
        chats.slice().reverse().forEach(chat => {
            const item = document.createElement('div');
            
            // class active berdasarkan currentChatId yang sedang aktif
            item.className = 'history-item' + (String(chat.id) === String(currentChatId) ? ' active' : '');
            
            item.textContent = chat.title;
            
            item.onclick = () => {
                loadChat(chat.id);
                updateHistoryList();           // <-- BARIS INI DITAMBAHKAN (penting!)
                historyDropdown.classList.remove('show');
            };
            
            historyList.appendChild(item);
        });
    }

    function setLoading(flag) {
        sendBtn.disabled = flag;
        sendBtn.innerHTML = flag ? '<div class="spinner"></div>' : '<i class="fas fa-paper-plane"></i>';
    }

    async function sendMessage() {
        const txt = inputEl.value.trim();
        if (!txt) return;

        const chat = chats.find(c => c.id === currentChatId);

        if (txt.toLowerCase() === "mode dere") {
            inputEl.value = '';
            chat.isUnlocked = true; 
            menuBtn.style.display = 'flex'; 
            appendMsg('user', txt);
            const reply = "Nezuko AI memasuki mode multi dere, dan voila! Silahkan pilih kepribadian Nezuko sesukamu di menu kiri bawah.";
            appendMsg('ai', reply);
            chat.messages.push({ role: "user", content: txt });
            chat.messages.push({ role: "assistant", content: reply });
            saveCurrentChat();
            return;
        }

        if (txt.toLowerCase() === "out mode") {
            inputEl.value = '';
            chat.isUnlocked = false; 
            menuBtn.style.display = 'none'; 
            currentMode = 'formal';
            applyTheme('formal');
            appendMsg('user', txt);
            const reply = "Nezuko kembali ke mode asisten formal. Menu kustomisasi telah dikunci.";
            appendMsg('ai', reply);
            chat.messages.push({ role: "user", content: txt });
            chat.messages.push({ role: "assistant", content: reply });
            chat.messages[0].content = systemPrompts['formal'];
            saveCurrentChat();
            return;
        }

        if (!currentChatId) createNewChat();
        appendMsg('user', txt);
        chat.messages.push({ role: "user", content: txt });
        saveCurrentChat();
        inputEl.value = '';
        setLoading(true);

        try {
            const resp = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${GROQ_API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: chat.messages,
                    temperature: (currentMode === 'adek-manja' || currentMode === 'deredere') ? 1.1 : (currentMode === 'kuudere' || currentMode === 'formal' ? 0.6 : 0.95),
                    max_tokens: 900,
                    top_p: 0.95,
                    presence_penalty: 0.6
                })
            });
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.error?.message || "API Error");
            const aiReply = data.choices[0].message.content.trim();
            appendMsg('ai', aiReply);
            chat.messages.push({ role: "assistant", content: aiReply });
            saveCurrentChat();
        } catch (err) {
            appendMsg('ai', `Duh, koneksi Nezuko lagi error... Coba lagi ya!`);
        } finally {
            setLoading(false);
        }
    }

    menuBtn.addEventListener('click', e => {
        e.stopPropagation();
        modeDropdown.classList.toggle('show');
        historyDropdown.classList.remove('show');
    });

    historyBtn.addEventListener('click', e => {
        e.stopPropagation();
        historyDropdown.classList.toggle('show');
        modeDropdown.classList.remove('show');
    });

    modeDropdown.addEventListener('click', e => {
        if (e.target.classList.contains('mode-item')) {
            const newMode = e.target.dataset.mode;
            if (newMode !== currentMode) {
                currentMode = newMode;
                const chat = chats.find(c => c.id === currentChatId);
                if (chat) {
                    chat.mode = currentMode;
                    chat.messages[0].content = systemPrompts[currentMode];
                    appendMsg('ai', statusMessages[currentMode]);
                    chat.messages.push({ role: "assistant", content: statusMessages[currentMode] });
                    saveCurrentChat();
                    applyTheme(currentMode);
                    document.querySelectorAll('.mode-item').forEach(item => {
                        item.classList.toggle('active', item.dataset.mode === currentMode);
                    });
                }
            }
            modeDropdown.classList.remove('show');
        }
    });

    clearChatBtn.addEventListener('click', () => {
        if (confirm("Yakin hapus chat ini?")) {
            chats = chats.filter(c => c.id !== currentChatId);
            localStorage.setItem('nezuko_chats', JSON.stringify(chats));
            if (chats.length > 0) {
                loadChat(chats[chats.length - 1].id);
            } else {
                createNewChat();
            }
            updateHistoryList();
            historyDropdown.classList.remove('show');
        }
    });

    // Fungsi untuk hapus semua tanpa sisa
clearAllChatsBtn.addEventListener('click', () => {
    if (confirm("Serius mau hapus SEMUA riwayat chat? Tindakan ini tidak bisa dibatalkan!")) {
        localStorage.removeItem('nezuko_chats'); // Hapus data di storage
        chats = []; // Kosongkan variabel array
        createNewChat(); // Buat chat baru yang fresh
        updateHistoryList(); // Update tampilan list (jadi kosong)
        historyDropdown.classList.remove('show');
        alert("Semua riwayat telah dibersihkan!");
    }
});

    newChatBtn.addEventListener('click', () => {
        createNewChat();
        historyDropdown.classList.remove('show');
    });

    document.addEventListener('click', () => {
        modeDropdown.classList.remove('show');
        historyDropdown.classList.remove('show');
    });

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keypress', e => { if (e.key === "Enter") sendMessage(); });

    window.onload = () => {
        currentMode = 'formal';
        menuBtn.style.display = 'none';
        applyTheme('formal');

        // Cek apakah ada chat yang tersimpan
        if (chats.length > 0) {
            // Load chat TERAKHIR (paling baru) supaya user balik lagi langsung lanjut
            const lastChatId = chats[chats.length - 1].id;
            loadChat(lastChatId);
        } else {
            // Baru kalau benar-benar kosong, buat yang baru
            createNewChat();
        }

        updateHistoryList();
    };
</script>
</body>
</html>
