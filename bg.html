<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Remove BG | Nezuko Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --bg: #050507;
            --card-bg: rgba(22, 22, 30, 0.95);
            --accent: #ff007f; /* Neon Pink */
            --secondary: #00f2ff; /* Electric Blue */
            --dark-btn: #1a1a24;
        }

        /* --- STABILIZER TENGAH LAYAR --- */
        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center; /* Paksa konten ke tengah vertikal */
            overflow: hidden;
            position: relative;
        }

        /* --- BACKGROUND PARTICLES --- */
        #particle-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* --- PRENIUM GLASSMORPHISM CARD --- */
        .main-card {
            width: 92%;
            max-width: 450px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 25px;
            box-shadow: 0 0 50px rgba(255, 0, 127, 0.2);
            z-index: 10;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center; /* Pusatkan semua konten secara horizontal */
        }

        /* --- HEADER & COIN --- */
        .coin-badge {
            position: absolute; top: -15px; right: 20px;
            background: linear-gradient(90deg, #ffd700, #ffa500);
            padding: 8px 15px; border-radius: 20px;
            font-weight: 800; font-size: 0.75rem; color: #000;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            display: flex; align-items: center; gap: 8px;
        }

        .header-section { text-align: center; margin-bottom: 25px; width: 100%; }
        .header-section h1 { color: var(--accent); font-size: 1.4rem; font-weight: 800; margin: 0; text-shadow: 0 0 10px var(--accent); letter-spacing: 2px; }
        .header-section p { font-size: 0.65rem; color: #666; text-transform: uppercase; margin-top: 5px; }

        /* --- UPLOAD ZONE (Perfect Centering Fix) --- */
        .upload-zone {
            width: 100%;
            border: 2px dashed rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            background: rgba(0,0,0,0.5);
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
            position: relative;
            box-sizing: border-box;
            
            /* Gunakan Flexbox untuk pusatkan konten */
            display: flex;
            flex-direction: column;
            align-items: center; /* Tengah horizontal */
            justify-content: center; /* Tengah vertikal */
            min-height: 180px; /* Jaga tinggi minimal */
        }
        .upload-zone:hover { border-color: var(--secondary); background: rgba(0, 242, 255, 0.05); }

        #uploadIcon { text-align: center; width: 100%; }

        #previewImg {
            max-width: 100%;
            max-height: 200px;
            border-radius: 12px;
            margin-top: 15px;
            display: none; /* Muncul setelah file dipilih */
            border: 2px solid var(--accent);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.3);
            object-fit: cover; /* Jaga aspek rasio gambar */
        }

        /* --- BUTTONS --- */
        .btn-main {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 18px;
            background: linear-gradient(90deg, var(--accent), #ff4d94);
            color: #fff;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            transition: 0.3s;
        }
        .btn-main:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-main:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(255, 0, 127, 0.4); }

        .btn-secondary {
            width: 100%;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            background: var(--dark-btn);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            transition: 0.3s;
        }
        .btn-secondary:hover { background: #252533; border-color: rgba(255, 255, 255, 0.2); }

    </style>
</head>
<body>

<canvas id="particle-canvas"></canvas>

<div class="main-card">
    <div class="coin-badge">
        <i class="fas fa-coins"></i> <span id="coinCount">10</span> COINS
    </div>

    <div class="header-section">
        <h1>REMOVE BACKGROUND</h1>
        <p>OFFICIAL AI ENGINE ENABLED</p>
    </div>

    <div class="upload-zone" onclick="document.getElementById('fileIn').click()">
        <div id="uploadIcon">
            <i class="fas fa-camera-retro" style="font-size: 3rem; color: var(--secondary); margin-bottom: 15px;"></i>
            <p style="margin:0; font-weight:700; font-size: 0.8rem; color: #888;">UPLOAD MEDIA</p>
        </div>
        <img id="previewImg">
        <input type="file" id="fileIn" hidden accept="image/*" onchange="previewFile()">
    </div>

    <button class="btn-main" id="processBtn" disabled onclick="startRemoval()">
        <i class="fas fa-bolt"></i> FETCH MEDIA
    </button>

    <a href="index.html" class="btn-secondary">
        <i class="fas fa-arrow-left"></i> KEMBALI KE DASHBOARD
    </a>
</div>

<script>
    // --- 1. COIN SYSTEM LOGIC ---
    let userCoins = parseInt(localStorage.getItem('nezukoCoins')) || 10;
    let lastReset = localStorage.getItem('lastCoinReset') || Date.now();

    function updateCoinDisplay() {
        const now = Date.now();
        if (now - lastReset > 24 * 60 * 60 * 1000) { userCoins = 10; lastReset = now; localStorage.setItem('lastCoinReset', lastReset); }
        document.getElementById('coinCount').innerText = userCoins;
        localStorage.setItem('nezukoCoins', userCoins);
    }
    updateCoinDisplay();

    // --- 2. PARTICLES (Cyberpunk Style) ---
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let p = [];
    function init() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        p = [];
        for(let i=0; i<60; i++) p.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, s: Math.random()*2, vx: Math.random()*0.6-0.3, vy: Math.random()*0.6-0.3, c: Math.random() > 0.5 ? '#ff007f' : '#00f2ff' });
    }
    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        p.forEach(i => {
            i.x+=i.vx; i.y+=i.vy;
            if(i.x<0||i.x>canvas.width) i.vx*=-1;
            if(i.y<0||i.y>canvas.height) i.vy*=-1;
            ctx.beginPath(); ctx.arc(i.x, i.y, i.s, 0, Math.PI*2);
            ctx.fillStyle = i.c; ctx.fill();
        });
        requestAnimationFrame(draw);
    }
    window.addEventListener('resize', init); init(); draw();

    // --- 3. PREVIEW & CENTERING ---
    function previewFile() {
        const file = document.getElementById('fileIn').files[0];
        const preview = document.getElementById('previewImg');
        const icon = document.getElementById('uploadIcon');
        const btn = document.getElementById('processBtn');
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = 'block'; // Tampilkan foto
                icon.style.display = 'none'; // Sembunyikan ikon kamera
                btn.disabled = false; // Aktifkan tombol
            };
            reader.readAsDataURL(file);
        }
    }

    // --- 4. OFFICIAL API ---
    async function startRemoval() {
        const file = document.getElementById('fileIn').files[0];
        if (!file) return;

        Swal.fire({ title: 'Processing...', text: 'Official AI Engine...', allowOutsideClick: false, background: '#16161e', color: '#fff', didOpen: () => Swal.showLoading() });

        const formData = new FormData();
        formData.append('image_file', file);
        formData.append('size', 'auto');

        try {
            const response = await fetch('https://api.remove.bg/v1.0/removebg', {
                method: 'POST',
                headers: { 'X-Api-Key': '7AucCbFMDbZZS3J38rMwCgi8' },
                body: formData
            });

            if (response.ok) {
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                Swal.close();
                Swal.fire({
                    title: 'PREMIUM RESULT',
                    imageUrl: url, imageWidth: 200,
                    showCancelButton: true,
                    showDenyButton: true,
                    confirmButtonText: '<i class="fas fa-download"></i> Standard',
                    denyButtonText: '<i class="fas fa-crown"></i> HD (5 Coins)',
                    cancelButtonText: 'Tutup',
                    background: '#16161e', color: '#fff',
                    confirmButtonColor: '#222',
                    denyButtonColor: '#ff007f',
                }).then((res) => {
                    if (res.isConfirmed) { downloadFile(url, 'Standard'); } 
                    else if (res.isDenied) {
                        if (userCoins >= 5) { userCoins -= 5; updateCoinDisplay(); downloadFile(url, 'HD'); Swal.fire('Success!', 'HD! Coin berkurang 5.', 'success'); } 
                        else { Swal.fire('Coin Kurang!', 'Butuh 5 coin untuk HD.', 'warning'); }
                    }
                });
            } else { Swal.fire('Error', 'Cek kuota API Key lo Mad.', 'error'); }
        } catch (e) { Swal.fire('Error', 'Server sibuk.', 'error'); }
    }

    function downloadFile(url, type) {
        const link = document.createElement('a');
        link.href = url;
        link.download = `Nezuko_${type}_${Date.now()}.png`;
        link.click();
    }
</script>
</body>
</html>
