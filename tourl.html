<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Image to URL | Nezuko Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --bg: #050507;
            --card-bg: rgba(22, 22, 30, 0.98);
            --accent: #ff007f;
        }
        body {
            background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0; width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }
        .main-card {
            width: 92%; max-width: 450px;
            background: var(--card-bg); backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px; padding: 30px;
            box-shadow: 0 0 50px rgba(255, 0, 127, 0.2);
            text-align: center;
        }
        .upload-zone {
            width: 100%; border: 2px dashed rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 40px; background: rgba(0,0,0,0.5);
            cursor: pointer; margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .upload-zone:hover { border-color: var(--accent); background: rgba(255,0,127,0.05); }
        #previewImg { max-width: 100%; max-height: 180px; border-radius: 12px; display: none; margin-top: 15px; border: 2px solid var(--accent); }
        .btn-main {
            width: 100%; padding: 18px; border: none; border-radius: 18px;
            background: linear-gradient(90deg, var(--accent), #ff4da6);
            color: #fff; font-weight: 800; cursor: pointer; transition: all 0.3s;
        }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,0,127,0.3); }
        .btn-main:disabled { opacity: 0.4; cursor: not-allowed; }
        #resultUrl {
            width: 100%; padding: 12px; margin-top: 15px;
            background: #111; color: var(--accent); border: 1px solid var(--accent);
            border-radius: 12px; text-align: center; font-size: 0.9rem; word-break: break-all;
            display: none;
        }
    </style>
</head>
<body>
<div class="main-card">
    <div style="margin-bottom: 25px;">
        <h1 style="color: var(--accent); font-size: 1.6rem; letter-spacing: 2px;">IMG → URL</h1>
        <p style="font-size: 0.7rem; color: #666;">Convert gambar ke link HD permanen (Catbox)</p>
    </div>
    <div class="upload-zone" id="uploadZone">
        <div id="uploadIcon">
            <i class="fas fa-images" style="font-size: 3.5rem; color: var(--accent); margin-bottom: 15px;"></i>
            <p style="font-size: 0.9rem; color: #aaa;">Klik atau drag gambar di sini</p>
        </div>
        <img id="previewImg" alt="Preview">
        <input type="file" id="fileIn" accept="image/*" hidden>
    </div>
    <button class="btn-main" id="processBtn" disabled>Generate HD URL</button>
    <div id="resultUrl"></div>
</div>

<script>
    const uploadZone = document.getElementById('uploadZone');
    const fileIn = document.getElementById('fileIn');
    const previewImg = document.getElementById('previewImg');
    const uploadIcon = document.getElementById('uploadIcon');
    const processBtn = document.getElementById('processBtn');
    const resultUrl = document.getElementById('resultUrl');

    let selectedFile = null;

    // Preview
    fileIn.addEventListener('change', e => {
        selectedFile = e.target.files[0];
        if (selectedFile) {
            const reader = new FileReader();
            reader.onload = ev => {
                previewImg.src = ev.target.result;
                previewImg.style.display = 'block';
                uploadIcon.style.display = 'none';
                processBtn.disabled = false;
            };
            reader.readAsDataURL(selectedFile);
        }
    });

    uploadZone.addEventListener('click', () => fileIn.click());

    ['dragover', 'dragenter'].forEach(event => {
        uploadZone.addEventListener(event, e => {
            e.preventDefault();
            uploadZone.style.borderColor = 'var(--accent)';
            uploadZone.style.background = 'rgba(255,0,127,0.08)';
        });
    });

    ['dragleave', 'drop'].forEach(event => {
        uploadZone.addEventListener(event, e => {
            e.preventDefault();
            uploadZone.style.borderColor = 'rgba(255,255,255,0.1)';
            uploadZone.style.background = 'rgba(0,0,0,0.5)';
        });
    });

    uploadZone.addEventListener('drop', e => {
        selectedFile = e.dataTransfer.files[0];
        if (selectedFile && selectedFile.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = ev => {
                previewImg.src = ev.target.result;
                previewImg.style.display = 'block';
                uploadIcon.style.display = 'none';
                processBtn.disabled = false;
            };
            reader.readAsDataURL(selectedFile);
        }
    });

    processBtn.addEventListener('click', async () => {
        if (!selectedFile) return;

        processBtn.disabled = true;
        processBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';

        const formData = new FormData();
        formData.append('reqtype', 'fileupload');
        formData.append('fileToUpload', selectedFile);

        try {
            // Pakai proxy CORS allorigins.win biar bypass restriction
            const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://catbox.moe/user/api.php');
            const response = await fetch(proxyUrl, {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error('Network response was not ok: ' + response.status);

            const url = await response.text();

            if (url.startsWith('https://files.catbox.moe/')) {
                resultUrl.textContent = url.trim();
                resultUrl.style.display = 'block';

                Swal.fire({
                    title: 'Berhasil!',
                    html: `Link HD Catbox siap:<br><strong>${url}</strong>`,
                    icon: 'success',
                    confirmButtonText: 'Copy Link',
                    background: '#16161e',
                    color: '#fff',
                    confirmButtonColor: '#ff007f'
                }).then((result) => {
                    if (result.isConfirmed) {
                        navigator.clipboard.writeText(url.trim());
                        Swal.fire({
                            title: 'Copied!',
                            icon: 'success',
                            timer: 1200,
                            showConfirmButton: false,
                            background: '#16161e'
                        });
                    }
                });
            } else {
                throw new Error('Upload gagal: ' + url);
            }
        } catch (err) {
            Swal.fire({
                title: 'Error!',
                html: `Gagal upload: <br>${err.message}<br><br>Coba:<br>1. Ganti jaringan/WiFi<br>2. Upload gambar lebih kecil<br>3. Refresh halaman`,
                icon: 'error',
                background: '#16161e',
                color: '#fff'
            });
        } finally {
            processBtn.disabled = false;
            processBtn.innerHTML = 'Generate HD URL';
        }
    });
</script>
</body>
</html>
