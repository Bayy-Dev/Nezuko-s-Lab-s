<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Support Nezuko Labs</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --bg: #050507;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        #particle-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }

        .container {
            width: 90%; max-width: 400px;
            z-index: 10; animation: fadeIn 1s ease-out;
        }

        .donation-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 40px 30px;
            border-radius: 35px;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }

        .profile img {
            width: 100px; height: 100px;
            border-radius: 50%; border: 3px solid var(--primary);
            padding: 5px; margin-bottom: 20px;
            object-fit: cover; box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
        }

        h2 { margin: 0; font-size: 1.5rem; font-weight: 800; }
        p.subtitle { color: #888; font-size: 0.8rem; margin: 10px 0 30px 0; }

        .input-box { position: relative; margin-bottom: 20px; }
        .input-box span {
            position: absolute; left: 20px; top: 50%;
            transform: translateY(-50%); color: var(--primary); font-weight: 800;
        }

        input {
            width: 100%; padding: 18px 20px 18px 55px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border); border-radius: 20px;
            color: white; font-size: 1.2rem; outline: none;
            box-sizing: border-box; transition: 0.3s;
            text-align: left;
        }
        input:focus { border-color: var(--primary); background: rgba(255, 255, 255, 0.1); }

        .btn-main {
            width: 100%; padding: 18px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none; border-radius: 20px;
            color: white; font-weight: 800; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 12px; transition: 0.3s;
        }
        .btn-main:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0, 210, 255, 0.3); }

        .btn-back {
            width: 100%; padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border); border-radius: 20px;
            color: #aaa; font-weight: 600; font-size: 0.8rem;
            text-decoration: none; display: inline-block;
            transition: 0.3s; box-sizing: border-box;
        }
        .btn-back:hover { background: rgba(255, 255, 255, 0.1); color: white; }

        .modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            z-index: 100; align-items: center; justify-content: center;
        }

        .modal-content {
            background: white; color: #1a1a1a;
            padding: 30px; border-radius: 30px;
            width: 85%; max-width: 340px; text-align: center;
        }

        #qrcode { display: flex; justify-content: center; margin: 20px 0; }
        #qrcode img { border: 10px solid #f8f9fa; border-radius: 15px; }
        .price-tag { font-size: 1.5rem; font-weight: 900; color: var(--secondary); margin: 10px 0; }
        
        .btn-wa {
            background: #25d366; color: white; text-decoration: none;
            display: block; padding: 12px; border-radius: 12px;
            margin-top: 10px; font-weight: bold; font-size: 14px;
        }

        .close-btn { 
            background: #f1f2f6; color: #666; margin-top: 10px; width: 100%; 
            padding: 12px; border: none; border-radius: 12px; 
            font-weight: bold; cursor: pointer;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<canvas id="particle-canvas"></canvas>

<div class="container">
    <div class="donation-card">
        <div class="profile">
            <img src="https://files.catbox.moe/s2n9gh.jpg" alt="Avatar">
            <h2>Support <br> Chiyoo Senpaii</h2>
            <p class="subtitle">Agar tambah semangat</p>
        </div>

        <div class="input-box">
            <span>Rp</span>
            <input type="number" id="nominal" placeholder="1000">
        </div>

        <button class="btn-main" onclick="prosesBayar()">Kirim Donasi</button>
        <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Kembali ke Dashboard</a>
    </div>
</div>

<div id="paymentModal" class="modal">
    <div class="modal-content">
        <h3 style="margin: 0;">Scan QRIS</h3>
        <div class="price-tag" id="display-nominal">Rp 1000</div>
        <div id="qrcode"></div>
        <p style="font-size: 11px; color: #888;">TERIMA KASIH ATAS DUKUNGAN ANDA 🤗</p>
        
        <a id="wa-link" href="#" target="_blank" class="btn-wa">Konfirmasi WhatsApp</a>
        <button class="close-btn" onclick="closeModal()">BATALKAN</button>
    </div>
</div>

<script>
    // PARTICLE ENGINE (Tampilan Kemarin)
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function init() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        particles = [];
        for(let i=0; i<60; i++) particles.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, sx:Math.random()*0.6-0.3, sy:Math.random()*0.6-0.3, o:Math.random()});
    }
    function animate() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        particles.forEach(p=>{
            p.x+=p.sx; p.y+=p.sy;
            if(p.x<0||p.x>canvas.width) p.sx*=-1; if(p.y<0||p.y>canvas.height) p.sy*=-1;
            ctx.fillStyle=`rgba(0,210,255,${p.o})`;
            ctx.beginPath(); ctx.arc(p.x,p.y,1.5,0,Math.PI*2); ctx.fill();
        });
        requestAnimationFrame(animate);
    }
    init(); animate();

    // LOGIKA QRIS (Tetap Pakai Logika Yang Baru 100% Benar)
    const BASE_QRIS = "00020101021126610014COM.GO-JEK.WWW01189360091434044314310210G4044314310303UMI51440014ID.CO.QRIS.WWW0215ID10254303952810303UMI5204566153033605802ID5923Bayz store, Toko Sepatu6010MAJALENGKA61054546262070703A016304";
    const NOMOR_WA = "6283894641570"; // Sesuaikan nomor WA lo Mad

    function calcCRC16(str) {
        let crc = 0xFFFF;
        for (let i = 0; i < str.length; i++) {
            crc ^= str.charCodeAt(i) << 8;
            for (let j = 0; j < 8; j++) {
                if ((crc & 0x8000) !== 0) crc = (crc << 1) ^ 0x1021;
                else crc <<= 1;
            }
        }
        return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
    }

    function prosesBayar() {
        const nominalInput = document.getElementById('nominal').value;
        
        if (!nominalInput || nominalInput < 1000) {
            Swal.fire({
                icon: 'warning',
                title: 'Waduh sorry bro..',
                text: 'Minimal Rp 1000 yaw 🙏',
                background: '#16161a',
                color: '#fff',
                confirmButtonColor: '#00d2ff'
            });
            return;
        }

        document.getElementById('display-nominal').innerText = "Rp " + parseInt(nominalInput).toLocaleString('id-ID');
        
        // Logic Dynamic Generate (Sesuai kode yang lo kasih)
        const tag54 = "54" + nominalInput.length.toString().padStart(2, '0') + nominalInput;
        let p = BASE_QRIS.split("5802ID");
        let fullPayload = p[0] + tag54 + "5802ID" + p[1];
        let finalQRIS = fullPayload + calcCRC16(fullPayload);

        // Render QR
        const qrContainer = document.getElementById('qrcode');
        qrContainer.innerHTML = "";
        new QRCode(qrContainer, {
            text: finalQRIS,
            width: 256,
            height: 256,
            correctLevel: QRCode.CorrectLevel.H
        });

        // Update WA Link
        const pesan = `Halo Chiyoo, Semoga donasi nya bisa membantu Rp ${nominalInput}. Ini bukti transfernya:`;
        document.getElementById('wa-link').href = `https://wa.me/${NOMOR_WA}?text=${encodeURIComponent(pesan)}`;

        document.getElementById('paymentModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('paymentModal').style.display = 'none';
    }

    window.onclick = function(event) {
        if (event.target == document.getElementById('paymentModal')) closeModal();
    }
</script>

</body>
</html>
